<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="change-shipping-address-button">
      Send Shipping Address Change
    </button>
    <button id="change-shipping-options-button">
      Send Shipping Options Change
    </button>
    <script>
      const changeShippingAddressButton = document.getElementById(
        "change-shipping-address-button"
      );

      changeShippingAddressButton.addEventListener("click", () => {
        navigator.serviceWorker.controller.postMessage({
          eventName: "shippingaddresschange",
          eventPayload: {
            orderId: "abcd1234",
            shippingAddress: {
              city: "New York",
              countryCode: "US",
              postalCode: "10001",
              state: "NY",
            },
          },
        });
      });

      const changeShippingOptionButton = document.getElementById(
        "change-shipping-options-button"
      );

      changeShippingOptionButton.addEventListener("click", () => {
        navigator.serviceWorker.controller.postMessage({
          eventName: "shippingoptionschange",
          eventPayload: {
            selectedShippingOption: {
              amount: {
                currencyCode: "USD",
                value: "0.00",
              },
              id: "free",
              label: "Free Shipping",
              selected: true,
            },
          },
        });
      });
    </script>
  </body>
</html>
