<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="change-shipping-address-button">Send Hello World</button>
    <script>
      const changeShippingAddressButton = document.getElementById(
        "change-shipping-address-button"
      );

      changeShippingAddressButton.addEventListener("click", () => {
        navigator.serviceWorker.controller.postMessage({
          eventName: "shippingaddresschange",
          eventPayload: {
            orderId: "abcd1234",
            partialShippingAddress: {
              city: "New York",
              countryCode: "US",
              postalCode: "10001",
              state: "NY",
            },
          },
        });
      });
    </script>
  </body>
</html>
